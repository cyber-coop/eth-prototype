# For more information, see https://github.com/rustsec/rustsec/blob/main/cargo-audit/audit.toml.example

[advisories]
ignore = [
    "RUSTSEC-2024-0421", # idna 0.4: dev-only, via web3 (no newer web3)
    "RUSTSEC-2026-0258", # h2 0.3: dev-only, via web3/hyper 0.14 (fixed only in h2 0.4)
    "RUSTSEC-2026-0387", # crypto-bigint 0.5 timing: via k256 0.13, fix needs k256 0.14
]
informational_warnings = ["unmaintained"]
severity_threshold = "high"

# Advisory Database Configuration
# [database]
# path = ".cargo/advisory-db"
# url = "https://github.com/RustSec/advisory-db.git"
# fetch = true
# stale = false

# Output Configuration
[output]
deny = []
format = "terminal"
quiet = false
show_tree = true

# Target Configuration
[target]
arch = ["x86_64"]
os = ["linux", "windows"]

[yanked]
enabled = true
update_index = true